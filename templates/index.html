<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Protótipo: Flask + Celery + Redis</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font-size: 1rem; padding: .4rem; }
    .tarefa { border: 1px solid #ccc; border-radius: 6px; padding: .6rem; margin: .5rem 0; font-family: monospace; }
    .SUCCESS { border-color: green; } .FAILURE { border-color: red; } .RETRY { border-color: orange; }
  </style>
</head>
<body>
  <h1>Fila de tarefas</h1>
  <p>Cada clique cria uma tarefa. O servidor responde na hora com um ID; o navegador pergunta o status a cada 1s.</p>
  <p>
    <input id="texto" value="Primeira mensagem">
    segundos <input id="segundos" type="number" value="5" style="width:4rem">
    chance de falha <input id="falha" type="number" value="0" step="0.1" min="0" max="1" style="width:4rem">
    <button onclick="criar()">Enviar</button>
  </p>
  <div id="lista"></div>

<script>
async function criar() {
  const t0 = performance.now();
  const resp = await fetch("/tarefas", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      texto: document.getElementById("texto").value,
      segundos: document.getElementById("segundos").value,
      chance_falha: document.getElementById("falha").value,
    }),
  });
  const { id } = await resp.json();
  const ms = Math.round(performance.now() - t0);

  const div = document.createElement("div");
  div.className = "tarefa";
  document.getElementById("lista").prepend(div);
  const linha = (txt) => `#${id.slice(0, 8)} (resposta em ${ms}ms) → ${txt}`;
  div.textContent = linha("na fila");

  const timer = setInterval(async () => {
    const s = await (await fetch(`/tarefas/${id}`)).json();
    div.className = "tarefa " + s.status;
    let txt = s.status;
    if (s.progresso) txt += ` ${s.progresso.atual}/${s.progresso.total}`;
    if (s.resultado) txt += ` ${JSON.stringify(s.resultado)}`;
    if (s.erro) txt += ` (${s.erro})`;
    div.textContent = linha(txt);
    if (s.status === "SUCCESS" || s.status === "FAILURE") clearInterval(timer);
  }, 1000);
}
</script>
</body>
</html>
